name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - if: matrix.os == 'windows-latest'
        run: |
          python -m pip install '.[windows-build]'
          python scripts/build-windows.py
          python scripts/smoke-windows.py dist/windows/MacNetLab/MacNetLab.exe
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: macnet-lab-windows-x64
          path: dist/windows/macnet-lab-*-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: macnet-lab-python-packages
          path: dist/*
