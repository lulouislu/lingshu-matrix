[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macnet-lab"
version = "0.1.2"
description = "Topology-aware Windows and macOS network operations workbench"
authors = [{name = "Zhenyu Lu (lulouislu)"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "httpx[socks]>=0.28,<1", "h11>=0.16,<1",
  "psutil>=6,<8", "dnspython>=2.7,<3", "asyncssh>=2.24,<3",
  "keyring>=25,<26",
  "pyobjc-framework-CoreWLAN>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
windows-build = ["pyinstaller>=6.16,<7; sys_platform == 'win32'"]

[project.scripts]
lingshu-matrix = "macnet.cli:main"
macnet-lab = "macnet.cli:main"

[project.urls]
Homepage = "https://github.com/lulouislu/lingshu-matrix"
Issues = "https://github.com/lulouislu/lingshu-matrix/issues"

[tool.setuptools.packages.find]
include = ["macnet*"]

[tool.setuptools.package-data]
macnet = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
